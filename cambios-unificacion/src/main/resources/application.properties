spring.application.name=agrovalle-connect

# Permite cargar las variables desde un archivo .env local (opcional, no versionado)
spring.config.import=optional:file:.env[.properties]

# --- PostgreSQL en Supabase (todo por variables de entorno) ---
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:3600000}

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
