# Las pruebas usan H2 en memoria: no requieren Supabase ni credenciales reales.
spring.datasource.url=jdbc:h2:mem:agrovalle;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
app.jwt.secret=clave-solo-para-pruebas-automatizadas-0123456789
app.jwt.expiration-ms=3600000
