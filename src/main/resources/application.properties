spring.application.name=agrovalle-connect

# Permite cargar las variables desde un archivo .env local (opcional, no versionado)
spring.config.import=optional:file:.env[.properties]

# --- PostgreSQL en Supabase (todo por variables de entorno) ---
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION:3600000}

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
# Abierto en desarrollo. Cada entorno decide si lo cierra (AV-021).
app.swagger.publico=${SWAGGER_PUBLICO:true}

# --- CORS (AV-020) ---
# Origenes autorizados a consumir la API desde un navegador, separados por coma.
# Por defecto los puertos habituales de Vite y Create React App en local.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
