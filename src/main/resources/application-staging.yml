# Perfil de Staging - AgroValle Connect
#
# Ningun valor sensible vive en este archivo: todo llega por variables de
# entorno, inyectadas desde GitHub Secrets en el pipeline de CD y desde las
# variables del servicio en el PaaS (Sesion 12, R-12.5).
#
# Variables requeridas en el entorno:
#   SUPABASE_DB_URL        cadena JDBC de la instancia de Supabase
#   SUPABASE_DB_USERNAME   usuario de la base de datos
#   SUPABASE_DB_PASSWORD   contrasena de la base de datos
#   JWT_SECRET             clave de firma, minimo 32 caracteres
#   PORT                   lo inyecta Render; por defecto 8080

spring:
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Supabase limita las conexiones del plan gratuito: 3 basta para una
      # instancia unica de 512 MB y deja margen para el editor SQL.
      maximum-pool-size: 3

  jpa:
    hibernate:
      # TODO (AV-023): pasar a 'validate' cuando Flyway gestione el esquema.
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    show-sql: false

server:
  port: ${PORT:8080}

app:
  jwt:
    # Las claves son 'app.jwt.*' porque es lo que lee JwtService (AV-002).
    secret: ${JWT_SECRET}
    # 24 horas, segun el flujo de autenticacion de la Sesion 13.
    expiration-ms: ${JWT_EXPIRATION:86400000}
