spring:
 datasource:
 url: ${DB_URL_VAR}
 username: ${DB_USER_VAR}
 password: ${DB_PASS_VAR}
 driver-class-name: org.postgresql.Driver

  jpa:
 hibernate:
 ddl-auto: ${DDL_AUTO:update}
 open-in-view: false
 show-sql: false

server:
 port: ${PORT:8080}
 
security:
 jwt:
 secret: ${JWT_SECRET_VAR}
 expiration-ms: 86400000
 
